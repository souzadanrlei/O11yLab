apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-gateway
spec:
  mode: deployment
  replicas: 1

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch: {}

    exporters:
      debug: {}

      loadbalancing/metrics:
        protocol:
          otlp:
            tls:
              insecure: true
        resolver:
          dns:
            hostname: otel-metrics-collector-headless.default.svc.cluster.local
            port: "4317"

      loadbalancing/traces:
        protocol:
          otlp:
            tls:
              insecure: true
        resolver:
          dns:
            hostname: otel-tracing-collector-headless.default.svc.cluster.local
            port: "4317"

      loadbalancing/logs:
        protocol:
          otlp:
            tls:
              insecure: true
        resolver:
          dns:
            hostname: otel-logs-collector-headless.default.svc.cluster.local
            port: "4317"

    service:
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [loadbalancing/metrics, debug]

        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [loadbalancing/logs, debug]

        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [loadbalancing/traces, debug]