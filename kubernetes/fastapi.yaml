apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
      - name: fastapi
        image: danrleisouza/fastapi-otel:1.0
        imagePullPolicy: Always
        ports:
          - containerPort: 8080
        env:
          - name: OTEL_SERVICE_NAME
            value: fastapi-service
          - name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED
            value: "true"
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: http://otel-gateway-collector-headless.default.svc.cluster.local:4317
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi
  namespace: default
spec:
  selector:
    app: fastapi
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: ClusterIP
